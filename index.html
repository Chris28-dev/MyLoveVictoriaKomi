<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Chat</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            overflow: hidden;
            position: relative;
        }

        /* Floating Hearts Background */
        .heart-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }
        .floating-heart {
            position: absolute;
            bottom: -50px;
            color: rgba(255, 255, 255, 0.4);
            animation: floatUp 6s linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.6); opacity: 0; }
            50% { opacity: 0.8; }
            100% { transform: translateY(-105vh) scale(1.2); opacity: 0; }
        }

        /* Main Container Layout */
        #main-container {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        /* Image Display Area */
        #image-display-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.5);
            border-bottom: 1px solid rgba(0,0,0,0.08);
        }
        .side-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 15px;
            border: 2px solid #ff4b6e;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .center-img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 20px;
            border: 3px solid #ff4b6e;
            box-shadow: 0 6px 15px rgba(255,75,110,0.3);
        }

        #chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 16px;
            line-height: 1.4;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .user {
            align-self: flex-end;
            background-color: #ff4b6e;
            color: white;
        }
        .bot {
            align-self: flex-start;
            background-color: #ffffff;
            color: #333;
            border: 1px solid #eee;
        }

        #options-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 15px;
            background: white;
            border-top: 1px solid #ddd;
            max-height: 40vh;
            overflow-y: auto;
        }
        .question-btn {
            padding: 12px 16px;
            border: 1px solid #ff4b6e;
            border-radius: 20px;
            background-color: white;
            color: #ff4b6e;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .question-btn:active {
            background-color: #ff4b6e;
            color: white;
        }
        .reset-btn {
            border-color: #aaa;
            color: #666;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- Floating Background Hearts -->
    <div class="heart-bg" id="heart-container"></div>

    <div id="main-container">
        <!-- Pictures Section -->
        <div id="image-display-area">
            <img src="Left.jpg" alt="Left" class="side-img">
            <img src="Center.jpg" alt="Center" class="center-img">
            <img src="Right.jpg" alt="Right" class="side-img">
        </div>

        <div id="chat-box"></div>
        <div id="options-area"></div>
    </div>

    <script>
        // ==========================================
        // EDIT YOUR QUESTIONS AND ANSWERS BELOW
        // ==========================================

        const CHAT_DATA = {
            
            initialQuestion: "ΠΟΙΟΣ ΕΙΣΑΙ!",

            option1: {
                buttonText: "Δεν είμαι η Βικτορία Κόμη",
                botReply: "Να πας να γαμηθείς"
            },

            option2: {
                buttonText: "Η Βικτωρία Κόμη❤️",
                botReply: "Πες μου, τι θα ήθελες να μάθεις",
                followUpQuestions: [
                    {
                        question: "Με αγαπάει ο Χρήστος Πασσαλής(Αρκούδος)",
                        answer: "❤️Ναι, θα σε αγαπάει για πάντα❤️"
                    },
                    {
                        question: "Ποια είναι η πιο όμορφη γυναίκα στον κόσμο?",
                        answer: "Εσύ🩷"
                    },
                    {
                        question: "Ποιο είναι το πιο γλυκό μωράκι?",
                        answer: "Εσύυυυυυυυυυ🩷"
                    },
                    {
                        question: "Τι είναι η Βικτωρία?",
                        answer: "💜Το πιο όμορφο λουλουδάκι💜 και μελλοντική γυναίκα🤍 του Χρήστου Πασσαλή"
                    }
                ]
            }
        };

        // ==========================================
        // CHAT LOGIC (NO NEED TO EDIT BELOW)
        // ==========================================

        const heartContainer = document.getElementById('heart-container');
        const symbols = ['❤️', '💖', '💕', '💗', '💓'];
        for (let i = 0; i < 15; i++) {
            const heart = document.createElement('div');
            heart.className = 'floating-heart';
            heart.textContent = symbols[Math.floor(Math.random() * symbols.length)];
            heart.style.left = Math.random() * 100 + '%';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
            heart.style.animationDelay = (Math.random() * 5) + 's';
            heartContainer.appendChild(heart);
        }

        const chatBox = document.getElementById('chat-box');
        const optionsArea = document.getElementById('options-area');

        function addMessage(text, sender) {
            const msg = document.createElement('div');
            msg.className = 'message ' + sender;
            msg.textContent = text;
            chatBox.appendChild(msg);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function startChat() {
            chatBox.innerHTML = '';
            optionsArea.innerHTML = '';

            addMessage(CHAT_DATA.initialQuestion, 'bot');

            const btn1 = document.createElement('button');
            btn1.className = 'question-btn';
            btn1.textContent = CHAT_DATA.option1.buttonText;
            btn1.onclick = () => chooseOption1();

            const btn2 = document.createElement('button');
            btn2.className = 'question-btn';
            btn2.textContent = CHAT_DATA.option2.buttonText;
            btn2.onclick = () => chooseOption2();

            optionsArea.appendChild(btn1);
            optionsArea.appendChild(btn2);
        }

        function chooseOption1() {
            addMessage(CHAT_DATA.option1.buttonText, 'user');
            optionsArea.innerHTML = '';

            setTimeout(() => {
                addMessage(CHAT_DATA.option1.botReply, 'bot');
                showResetButton();
            }, 500);
        }

        function chooseOption2() {
            addMessage(CHAT_DATA.option2.buttonText, 'user');
            optionsArea.innerHTML = '';

            setTimeout(() => {
                addMessage(CHAT_DATA.option2.botReply, 'bot');
                showFollowUpQuestions();
            }, 500);
        }

        function showFollowUpQuestions() {
            CHAT_DATA.option2.followUpQuestions.forEach(pair => {
                const btn = document.createElement('button');
                btn.className = 'question-btn';
                btn.textContent = pair.question;
                btn.onclick = () => {
                    addMessage(pair.question, 'user');
                    setTimeout(() => {
                        addMessage(pair.answer, 'bot');
                    }, 500);
                };
                optionsArea.appendChild(btn);
            });

            showResetButton();
        }

        function showResetButton() {
            const resetBtn = document.createElement('button');
            resetBtn.className = 'question-btn reset-btn';
            resetBtn.textContent = "↺ Start Over";
            resetBtn.onclick = startChat;
            optionsArea.appendChild(resetBtn);
        }

        startChat();
    </script>

</body>
</html>
